server:
  port: 8080

spring:
  application:
    # This name is used when the gateway registers itself with Eureka
    name: hrims-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # We define routes manually below for full control
              # Set to true only if you want auto-routes from Eureka (not recommended)
              enabled: false
              lower-case-service-id: true

          routes:

            # ── Organisation Service ────────────────────────────────────────────
            # Handles: /api/organisations/**, /api/entities/**, /api/entity-metadata/**
            # StripPrefix=1 removes /api before forwarding to the service
            # Example: /api/organisations/123 → forwarded as /organisations/123
            - id: organisation-service
              uri: lb://organisation-service
              predicates:
                - Path=/api/organisations/**,/api/entities/**,/api/entity-metadata/**
              filters:
                - StripPrefix=1

            # ── User Service ────────────────────────────────────────────────────
            # Handles: /api/users/**, /api/auth/**
            # Example: /api/auth/login → forwarded as /auth/login
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**,/api/auth/**
              filters:
                - StripPrefix=1

          # Global filter applied to every route
          # Removes duplicate CORS headers that some services may add
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ── Eureka Client ────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      # Must point to the running hrims-discovery server
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    # Heartbeat interval
    lease-renewal-interval-in-seconds: 10
    # Eureka removes this instance after 30s of no heartbeat
    lease-expiration-duration-in-seconds: 30

# ── Actuator ─────────────────────────────────────────────────────────────────
# Visit http://localhost:8080/actuator/gateway/routes to see all active routes
# Visit http://localhost:8080/actuator/health to check gateway health
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      access: read_only
    health:
      show-details: always

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO