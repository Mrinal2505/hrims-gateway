server:
  port: 8080

spring:
  application:
    name: hrims-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

          routes:

            # ── Organisation Service ────────────────────────────────────────────
            - id: organisation-service
              uri: lb://organisation-service
              predicates:
                - Path=/api/organisations/**,/api/entities/**,/api/entity-metadata/**
              filters:
                - StripPrefix=1

            # ── Organisation Service Swagger ────────────────────────────────────
            - id: organisation-service-swagger
              uri: lb://organisation-service
              predicates:
                - Path=/api/org/swagger-ui/**,/api/org/v3/api-docs/**,/api/org/swagger-ui.html
              filters:
                - StripPrefix=2

            # ── User Service ────────────────────────────────────────────────────
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**,/api/auth/**
              filters:
                - StripPrefix=1

            # ── User Service Swagger ─────────────────────────────────────────────
            - id: user-service-swagger
              uri: lb://user-service
              predicates:
                - Path=/api/user/swagger-ui/**,/api/user/v3/api-docs/**,/api/user/swagger-ui.html
              filters:
                - StripPrefix=2

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      access: read_only
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO